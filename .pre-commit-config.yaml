# Pre-commit configuration for CVGAI Group 4.
# Uses local-first execution for Python tools to reuse the active virtual environment.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# Ignore teacher's class material and raw sample receipts
exclude: "^(class-material/|data/)"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=15000"]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --line-length 120
        language: system
        types: [python]
        files: "^(src|tests)/"
        pass_filenames: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: "^(src|tests)/"
        pass_filenames: true
